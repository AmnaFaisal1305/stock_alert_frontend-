<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/icon-image.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Stock Alert | AKUH</title>
    <meta name="theme-color" content="#1d2721" />
    <!-- Figtree is bundled via @fontsource-variable/figtree (imported in main.jsx)
         so the PWA service worker precaches it and it renders offline. -->
  </head>
  <body>
    <!-- apply saved theme before paint to avoid a flash -->
    <script>try{var t=localStorage.getItem('sst_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
