<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- safe zone fill for maskable -->
  <rect width="512" height="512" rx="80" fill="#006241"/>
  <!-- syringe body -->
  <rect x="220" y="120" width="72" height="200" rx="16" fill="white" opacity="0.95"/>
  <!-- plunger -->
  <rect x="240" y="100" width="32" height="40" rx="6" fill="white" opacity="0.7"/>
  <!-- needle -->
  <rect x="248" y="316" width="16" height="56" rx="6" fill="white" opacity="0.8"/>
  <!-- dose marks -->
  <rect x="220" y="180" width="20" height="6" rx="3" fill="#006241" opacity="0.5"/>
  <rect x="220" y="210" width="20" height="6" rx="3" fill="#006241" opacity="0.5"/>
  <rect x="220" y="240" width="20" height="6" rx="3" fill="#006241" opacity="0.5"/>
  <!-- cross / alert indicator -->
  <rect x="310" y="248" width="88" height="20" rx="10" fill="white" opacity="0.9"/>
  <rect x="340" y="218" width="20" height="80" rx="10" fill="white" opacity="0.9"/>
</svg>
